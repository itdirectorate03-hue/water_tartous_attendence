<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الحضور">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>شركة مياه طرطوس - رابط الدوام</title>
    <style>
        :root { --primary-color: #0056b3; --success-color: #28a745; --danger-color: #dc3545; --warning-color: #ff9800; --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 460px; margin: auto; background: var(--card-bg); padding: 18px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; flex: 1; }

        .title { text-align: center; color: var(--primary-color); font-size: 1.25rem; font-weight: 700; margin: 0 0 2px 0; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.95rem; font-weight: 600; margin: 0 0 12px 0; }

        .status-banner { width: 100%; padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .banner-online { background: #d1fae5; color: #065f46; border: 1px solid #059669; }
        .banner-offline { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }

        .stats-container { display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
        .stat-box { flex: 1; padding: 6px 8px; border-radius: 8px; text-align: center; background: #f8fafc; border: 1px solid #e2e8f0; }
        .stat-number { font-size: 16px; font-weight: bold; display: block; margin-top: 2px; }
        .stat-sent { color: #2563eb; }
        .stat-pending { color: #d97706; }

        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #475569; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
        input:focus { border-color: var(--primary-color); outline: none; }
        #empName { font-weight: bold; color: var(--primary-color); background: #eef4fc; border: 1px dashed var(--primary-color); }
        #msg { margin-top: 3px; font-size: 0.8rem; min-height: 16px; }
        .error-text { color: var(--danger-color); }
        .success-text { color: var(--success-color); }
        .gps-box { padding: 8px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; text-align: center; font-weight: bold; line-height: 1.5; }
        button[type="submit"] { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
        button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
        .retry-gps { background: #6c757d; color: white; border: none; border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; cursor: pointer; margin-top: 4px; }
        #statusBox { margin-top: 10px; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; display: none; }
        .status-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .status-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        footer { text-align: center; margin-top: 15px; font-size: 0.72rem; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">شركة مياه طرطوس</h1>
        <p class="subtitle">رابط الدوام</p>

        <div id="connectionBanner" class="status-banner banner-online">🟢 الحالة: متصل (اونلاين)</div>

        <div class="stats-container">
            <div class="stat-box">
                <span style="font-size: 10px; color: #64748b; font-weight: bold;">المرسلة بنجاح</span>
                <span id="sentCount" class="stat-number stat-sent">0</span>
            </div>
            <div class="stat-box">
                <span style="font-size: 10px; color: #64748b; font-weight: bold;">المعلقة (أوفلاين)</span>
                <span id="pendingCount" class="stat-number stat-pending">0</span>
            </div>
        </div>

        <form id="attendanceForm" autocomplete="off">
            <div class="form-group">
                <label for="empId">الرقم الوظيفي:</label>
                <input type="text" id="empId" placeholder="أدخل رقمك الوظيفي" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <div id="msg"></div>
            </div>

            <div class="form-group">
                <label for="empName">اسم الموظف:</label>
                <input type="text" id="empName" readonly placeholder="سيظهر الاسم تلقائياً">
            </div>

            <div class="form-group">
                <label>موقع الـ GPS:</label>
                <div id="gpsDisplay" class="gps-box">⏳ جاري تحديد موقعك تلقائياً...</div>
            </div>

            <button type="submit" id="submitBtn" disabled>إثبات الحضور</button>
        </form>

        <div id="statusBox"></div>
    </div>

    <footer>مديرية المعلوماتية والتقانة - شركة مياه طرطوس</footer>

    <script>
    // ============================================================
    // 1) تنظيف SW القديم + تسجيل الجديد
    // ============================================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
                // احذف فقط SW القديم من Blob
                if (reg.active && reg.active.scriptURL && reg.active.scriptURL.indexOf('blob:') === 0) {
                    reg.unregister();
                }
            });
        });

        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                .then(function (reg) {
                    console.log('SW registered:', reg.scope);
                    // Force update check
                    reg.update();
                })
                .catch(function (err) { console.log('SW failed:', err); });
        });
    }

    // ============================================================
    // 2) Polyfill fetch
    // ============================================================
    if (typeof window.fetch !== 'function') {
        window.fetch = function (url, options) {
            options = options || {};
            return new Promise(function (resolve, reject) {
                var xhr = new XMLHttpRequest();
                try { xhr.open(options.method || 'GET', url, true); }
                catch (e) { reject(new Error('XHR open failed')); return; }
                if (options.headers) {
                    for (var k in options.headers) {
                        if (Object.prototype.hasOwnProperty.call(options.headers, k)) {
                            try { xhr.setRequestHeader(k, options.headers[k]); } catch (e) {}
                        }
                    }
                }
                xhr.onload = function () {
                    var text = xhr.responseText || '';
                    resolve({
                        ok: xhr.status >= 200 && xhr.status < 300,
                        status: xhr.status,
                        text: function () { return Promise.resolve(text); },
                        json: function () {
                            return new Promise(function (res, rej) {
                                try { res(JSON.parse(text)); } catch (err) { rej(err); }
                            });
                        }
                    });
                };
                xhr.onerror = function () { reject(new Error('Network error')); };
                xhr.ontimeout = function () { reject(new Error('Timeout')); };
                xhr.onabort = function () { reject(new Error('Aborted')); };
                try { xhr.send(options.body || null); }
                catch (e) { reject(new Error('XHR send failed')); }
            });
        };
    }

    function fetchWithTimeout(url, options, timeoutMs) {
        return new Promise(function (resolve, reject) {
            var done = false;
            var timer = setTimeout(function () {
                if (!done) { done = true; reject(new Error('Timeout')); }
            }, timeoutMs);
            fetch(url, options).then(function (res) {
                if (!done) { done = true; clearTimeout(timer); resolve(res); }
            }).catch(function (err) {
                if (!done) { done = true; clearTimeout(timer); reject(err); }
            });
        });
    }

    // ============================================================
    // 3) الإعدادات
    // ============================================================
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmTk09A-MmqUPdePjNz2th7sCmRR-24CXF-5rG4Qj2w4faXYftLOE2W0wKYs4BYXyXvQ/exec";
    var QUEUE_KEY = 'offline_attendance_queue';
    var SENT_COUNT_KEY = 'successful_sent_count';
    var CHUNK_SIZE = 25;
    var SEND_TIMEOUT_MS = 30000;

    var isEmpValid = false;
    var isGpsValid = false;
    var isSending = false;
    var gpsLat = null, gpsLng = null, gpsAccuracy = null;
    var empData = { name: '', dept: '', jobType: '', workPlace: '' };
    var debounceTimer = null;
    var syncRetryTimer = null;

    var empIdInput, empNameInput, msgDiv, gpsDisplay, submitBtn, statusBox;
    var connectionBanner, sentCountDisplay, pendingCountDisplay;

    // ============================================================
    // 4) توقيت سوريا GMT+3
    // ============================================================
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function getSyriaTimeString() {
        var now = new Date();
        var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
        var syria = new Date(utcMs + (3 * 3600000));
        return syria.getFullYear() + '-' + pad2(syria.getMonth() + 1) + '-' + pad2(syria.getDate()) +
               ' ' + pad2(syria.getHours()) + ':' + pad2(syria.getMinutes()) + ':' + pad2(syria.getSeconds());
    }

    function getDeviceId() {
        var id = localStorage.getItem('device_unique_id');
        if (!id) {
            id = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem('device_unique_id', id);
        }
        return id;
    }

    // ============================================================
    // 5) UI
    // ============================================================
    function updateUI() {
        try {
            var pendingList = getQueue();
            var sentCount = parseInt(localStorage.getItem(SENT_COUNT_KEY) || "0", 10);
            if (pendingCountDisplay) pendingCountDisplay.innerText = pendingList.length;
            if (sentCountDisplay) sentCountDisplay.innerText = sentCount;
            if (connectionBanner) {
                if (navigator.onLine) {
                    connectionBanner.className = "status-banner banner-online";
                    connectionBanner.innerText = "🟢 الحالة: متصل (اونلاين)";
                } else {
                    connectionBanner.className = "status-banner banner-offline";
                    connectionBanner.innerText = "🔴 الحالة: غير متصل (اوفلاين)";
                }
            }
        } catch (e) { console.error('updateUI:', e); }
    }

    function incrementSentCount(n) {
        var current = parseInt(localStorage.getItem(SENT_COUNT_KEY) || "0", 10);
        current += n;
        localStorage.setItem(SENT_COUNT_KEY, current.toString());
        updateUI();
    }

    // ============================================================
    // 6) GPS
    // ============================================================
    function startGpsFetch() {
        try {
            gpsDisplay.innerHTML = "⏳ جاري تحديد موقعك تلقائياً...";
            gpsDisplay.style.color = "#334155";
            isGpsValid = false;
            checkFormValidity();

            if (!navigator.geolocation) {
                gpsDisplay.innerHTML = "❌ متصفحك لا يدعم تحديد الموقع";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    gpsLat = pos.coords.latitude;
                    gpsLng = pos.coords.longitude;
                    gpsAccuracy = Math.round(pos.coords.accuracy);
                    isGpsValid = true;
                    gpsDisplay.innerHTML = '✅ <strong>تم استخراج الموقع</strong><br>' +
                        gpsLat.toFixed(5) + ' , ' + gpsLng.toFixed(5) + ' (≈' + gpsAccuracy + 'م)';
                    gpsDisplay.style.color = "#047857";
                    checkFormValidity();
                },
                function (err) {
                    gpsLat = null; gpsLng = null; gpsAccuracy = null;
                    isGpsValid = false;
                    var reason = "تعذر الحصول على الموقع";
                    if (err.code === 1) reason = "تم رفض صلاحية الموقع — فعّلها من إعدادات المتصفح";
                    else if (err.code === 2) reason = "الموقع غير متاح — تأكد من تشغيل GPS";
                    else if (err.code === 3) reason = "انتهت مهلة تحديد الموقع";
                    gpsDisplay.innerHTML = '❌ ' + reason + '<br>' +
                        '<button type="button" class="retry-gps" onclick="startGpsFetch()">🔄 إعادة المحاولة</button>';
                    gpsDisplay.style.color = "#b91c1c";
                    checkFormValidity();
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } catch (e) { console.error('GPS:', e); }
    }

    function checkFormValidity() {
        try {
            if (isEmpValid && isGpsValid && !isSending && empIdInput.value.trim() !== "") {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        } catch (e) { console.error('checkFormValidity:', e); }
    }

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status-' + type;
        statusBox.style.display = 'block';
    }

    function hideStatus(delay) {
        setTimeout(function () { statusBox.style.display = 'none'; }, delay || 5000);
    }

    function updateLocalEmployeesCache() {
        if (!navigator.onLine) return;
        fetchWithTimeout(SCRIPT_URL + "?action=getAllEmployees", {}, 15000)
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success && data.employees) {
                    localStorage.setItem('cached_emp_names', JSON.stringify(data.employees));
                }
            })
            .catch(function () {});
    }

    // ============================================================
    // 7) مراقبة الرقم الوظيفي
    // ============================================================
    function handleEmpIdInput() {
        try {
            var val = empIdInput.value.trim();
            clearTimeout(debounceTimer);
            isEmpValid = false;
            empNameInput.value = '';
            msgDiv.textContent = '';
            checkFormValidity();
            if (!val) return;

            var cacheHit = false;
            var cachedStr = localStorage.getItem('cached_emp_names');
            if (cachedStr) {
                try {
                    var map = JSON.parse(cachedStr);
                    if (map[val] && map[val].name) {
                        empData = map[val];
                        empNameInput.value = empData.name;
                        msgDiv.textContent = navigator.onLine
                            ? "✓ موظف موجود في قاعدة البيانات (جاري التحديث...)"
                            : "✓ موظف موجود في قاعدة البيانات (من الذاكرة)";
                        msgDiv.className = "success-text";
                        isEmpValid = true;
                        checkFormValidity();
                        cacheHit = true;
                    }
                } catch (e) {}
            }

            if (!navigator.onLine) {
                if (!cacheHit) {
                    msgDiv.textContent = "❌ غير موجود محلياً، يلزم إنترنت للتحقق";
                    msgDiv.className = "error-text";
                }
                return;
            }

            if (!cacheHit) {
                msgDiv.textContent = "⏳ جاري التحقق...";
                msgDiv.className = "";
            }

            debounceTimer = setTimeout(function () {
                if (empIdInput.value.trim() !== val) return;

                fetchWithTimeout(SCRIPT_URL + "?action=getEmpName&empId=" + encodeURIComponent(val), {}, 10000)
                    .then(function (res) { return res.json(); })
                    .then(function (result) {
                        if (empIdInput.value.trim() !== val) return;
                        if (result.success && result.empName) {
                            empData = {
                                name: result.empName,
                                dept: result.dept || '',
                                jobType: result.jobType || '',
                                workPlace: result.workPlace || ''
                            };
                            empNameInput.value = empData.name;
                            msgDiv.textContent = "✓ موظف موجود في قاعدة البيانات";
                            msgDiv.className = "success-text";
                            isEmpValid = true;
                            try {
                                var map = JSON.parse(localStorage.getItem('cached_emp_names') || '{}');
                                map[val] = empData;
                                localStorage.setItem('cached_emp_names', JSON.stringify(map));
                            } catch (e) {}
                            checkFormValidity();
                        } else {
                            msgDiv.textContent = "❌ الرقم غير موجود في قاعدة البيانات";
                            msgDiv.className = "error-text";
                            isEmpValid = false;
                            checkFormValidity();
                        }
                    })
                    .catch(function () {
                        if (empIdInput.value.trim() !== val) return;
                        if (cacheHit) {
                            msgDiv.textContent = "✓ موظف موجود في قاعدة البيانات (من الذاكرة)";
                            msgDiv.className = "success-text";
                            isEmpValid = true;
                        } else {
                            msgDiv.textContent = "❌ تعذر الاتصال بالسيرفر";
                            msgDiv.className = "error-text";
                            isEmpValid = false;
                        }
                        checkFormValidity();
                    });
            }, 300);
        } catch (e) { console.error('handleEmpIdInput:', e); }
    }

    // ============================================================
    // 8) الإرسال
    // ============================================================
    function sendSingleWithTimeout(payload) {
        return fetchWithTimeout(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        }, SEND_TIMEOUT_MS).then(function (res) {
            if (!res.ok) return 'offline';
            return res.json().then(function (data) {
                return (data && data.success) ? 'success' : 'rejected';
            });
        }).catch(function () {
            return 'offline';
        });
    }

    function handleAttendanceSubmit(e) {
        e.preventDefault();
        if (!isEmpValid || !isGpsValid || isSending) return;

        isSending = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ جاري الإرسال...";
        statusBox.style.display = 'none';

        var origin = navigator.onLine ? "متصل" : "غير متصل";

        var payload = {
            empId: empIdInput.value.trim(),
            empName: empData.name || empNameInput.value.trim(),
            dept: empData.dept || '',
            jobType: empData.jobType || '',
            workPlace: empData.workPlace || '',
            latitude: gpsLat,
            longitude: gpsLng,
            accuracy: gpsAccuracy,
            deviceTimestamp: getSyriaTimeString(),
            deviceId: getDeviceId(),
            origin: origin
        };

        var afterResult = function (result) {
            if (result === 'success') {
                incrementSentCount(1);
                showStatus("✅ تم تسجيل الحضور بنجاح", "success");
                hideStatus(5000);
            } else if (result === 'rejected') {
                showStatus("❌ رفض السيرفر الطلب — تحقق من رقمك الوظيفي", "error");
                hideStatus(6000);
            } else {
                saveToQueue(payload);
                showStatus(
                    navigator.onLine
                        ? "⏱️ انتهت 30 ثانية دون رد — تم حفظ البصمة محلياً وسيتم إرسالها تلقائياً"
                        : "📴 لا يوجد إنترنت — تم حفظ البصمة محلياً وسيتم إرسالها تلقائياً",
                    "warning"
                );
                hideStatus(6000);
                if (navigator.onLine) processBatchesInChunks();
            }

            empIdInput.value = '';
            empNameInput.value = '';
            msgDiv.textContent = '';
            isEmpValid = false;
            isSending = false;
            submitBtn.textContent = "إثبات الحضور";
            checkFormValidity();
            updateUI();
            setTimeout(startGpsFetch, 800);
        };

        if (navigator.onLine) {
            sendSingleWithTimeout(payload).then(afterResult);
        } else {
            afterResult('offline');
        }
    }

    function saveToQueue(payload) {
        var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
        q.push(payload);
        localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
        updateUI();
    }

    function getQueue() {
        try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
        catch (e) { return []; }
    }

    // ============================================================
    // 9) المزامنة الجماعية
    // ============================================================
    function processBatchesInChunks() {
        if (!navigator.onLine) return Promise.resolve(false);
        if (processBatchesInChunks._running) return Promise.resolve(false);
        processBatchesInChunks._running = true;

        var totalSent = 0;

        function processNext() {
            var queue = getQueue();
            if (queue.length === 0) {
                processBatchesInChunks._running = false;
                updateUI();
                if (totalSent > 0) {
                    showStatus("✅ تم إرسال " + totalSent + " عملية أوفلاين بنجاح", "success");
                    hideStatus(6000);
                }
                return Promise.resolve(true);
            }

            var chunk = queue.slice(0, CHUNK_SIZE);

            return fetchWithTimeout(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(chunk)
            }, SEND_TIMEOUT_MS).then(function (res) {
                if (!res.ok) throw new Error('not ok');
                return res.json();
            }).then(function (data) {
                var q = getQueue();
                if (data && data.success) {
                    q.splice(0, chunk.length);
                    localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
                    incrementSentCount(chunk.length);
                    totalSent += chunk.length;
                } else if (data && typeof data.processed === 'number' && data.processed > 0) {
                    q.splice(0, data.processed);
                    localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
                    incrementSentCount(data.processed);
                    totalSent += data.processed;
                    processBatchesInChunks._running = false;
                    updateUI();
                    if (totalSent > 0) {
                        showStatus("✅ تم إرسال " + totalSent + " عملية أوفلاين بنجاح", "success");
                        hideStatus(6000);
                    }
                    return false;
                } else {
                    processBatchesInChunks._running = false;
                    updateUI();
                    return false;
                }
                return new Promise(function (r) { setTimeout(r, 800); }).then(processNext);
            }).catch(function () {
                processBatchesInChunks._running = false;
                updateUI();
                if (totalSent > 0) {
                    showStatus("✅ تم إرسال " + totalSent + " عملية أوفلاين بنجاح", "success");
                    hideStatus(6000);
                }
                return false;
            });
        }

        return processNext();
    }

    function scheduleSyncRetry() {
        if (syncRetryTimer) return;
        syncRetryTimer = setInterval(function () {
            if (getQueue().length === 0) return;
            if (!navigator.onLine) return;
            processBatchesInChunks();
        }, 30000);
    }

    // ============================================================
    // 10) التشغيل
    // ============================================================
    function init() {
        try {
            empIdInput = document.getElementById('empId');
            empNameInput = document.getElementById('empName');
            msgDiv = document.getElementById('msg');
            gpsDisplay = document.getElementById('gpsDisplay');
            submitBtn = document.getElementById('submitBtn');
            statusBox = document.getElementById('statusBox');
            connectionBanner = document.getElementById('connectionBanner');
            sentCountDisplay = document.getElementById('sentCount');
            pendingCountDisplay = document.getElementById('pendingCount');

            // ✅ حماية: تأكد أن حقل الرقم دائماً مفتوح
            empIdInput.disabled = false;
            empIdInput.readOnly = false;
            empIdInput.style.pointerEvents = 'auto';
            empIdInput.style.opacity = '1';

            empIdInput.addEventListener('input', handleEmpIdInput);
            document.getElementById('attendanceForm').addEventListener('submit', handleAttendanceSubmit);

            window.addEventListener('online', function () {
                updateUI();
                updateLocalEmployeesCache();
                processBatchesInChunks();
            });
            window.addEventListener('offline', function () { updateUI(); });
            window.addEventListener('focus', function () {
                if (navigator.onLine) processBatchesInChunks();
            });
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible' && navigator.onLine) {
                    processBatchesInChunks();
                }
            });
            window.addEventListener('beforeunload', function (e) {
                if (getQueue().length > 0) {
                    e.preventDefault();
                    e.returnValue = 'لديك بصمات لم تُرسل بعد. هل تريد إغلاق الصفحة؟';
                    return e.returnValue;
                }
            });

            startGpsFetch();
            updateLocalEmployeesCache();
            updateUI();

            var pendingOnLoad = getQueue().length;
            if (pendingOnLoad > 0) {
                showStatus("⏳ لديك " + pendingOnLoad + " بصمة معلقة، جاري محاولة الإرسال...", "warning");
            }
            if (navigator.onLine) {
                processBatchesInChunks();
                fetchWithTimeout(SCRIPT_URL + "?action=ping", {}, 5000).catch(function () {});
            }
            setTimeout(function () {
                if (navigator.onLine && getQueue().length > 0) {
                    processBatchesInChunks();
                }
            }, 2000);

            scheduleSyncRetry();
        } catch (err) {
            console.error('Init error:', err);
            // حماية أخيرة: افتح الحقل حتى لو فيه خطأ
            try {
                var input = document.getElementById('empId');
                if (input) {
                    input.disabled = false;
                    input.readOnly = false;
                }
            } catch (e) {}
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
