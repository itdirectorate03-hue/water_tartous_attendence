<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور والدوام</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 15px; }
        
        .status-banner { width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: 15px; transition: all 0.3s ease; }
        .banner-online { background-color: #d1fae5; color: #065f46; border: 2px solid #059669; }
        .banner-offline { background-color: #fee2e2; color: #991b1b; border: 2px solid #dc2626; }
        
        .stats-container { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .stat-box { flex: 1; padding: 10px; border-radius: 8px; text-align: center; background-color: #f8fafc; border: 1px solid #e2e8f0; }
        .stat-number { font-size: 20px; font-weight: bold; display: block; margin-top: 4px; }
        .stat-sent { color: #2563eb; }
        .stat-pending { color: #d97706; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input:focus { border-color: #2563eb; outline: none; }
        
        .emp-name-box { padding: 10px; background-color: #e0f2fe; color: #0369a1; border-radius: 6px; font-weight: bold; text-align: center; margin-top: 8px; display: none; }
        
        button[type="submit"] { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button[type="submit"]:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-size: 14px; font-weight: bold; display: none; line-height: 1.5; }
        .success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل الحضور والدوام</h2>

    <div id="connectionBanner" class="status-banner banner-online">🟢 متصل بالإنترنت</div>

    <div class="stats-container">
        <div class="stat-box">
            <span style="font-size: 12px; color: #64748b; font-weight: bold;">المرسلة نجاحاً</span>
            <span id="sentCount" class="stat-number stat-sent">0</span>
        </div>
        <div class="stat-box">
            <span style="font-size: 12px; color: #64748b; font-weight: bold;">المعلقة (أوفلاين)</span>
            <span id="pendingCount" class="stat-number stat-pending">0</span>
        </div>
    </div>

    <form id="attendanceForm">
        <div class="form-group">
            <label for="empId">الرقم الوظيفي:</label>
            <input type="number" id="empId" placeholder="أدخل الرقم الوظيفي" required autocomplete="off">
            <div id="empNameDisplay" class="emp-name-box"></div>
        </div>

        <button type="submit" id="submitBtn">تأكيد وتسجيل الحضور</button>
    </form>

    <div id="statusBox" class="status-msg"></div>
</div>

<script>
    // ⚠️ استبدل هذا الرابط برابط التطبيق الخص بك المنتهي بـ /exec
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_e8DNELnUzDMcy6csN3JXWu6e30A5_jZtlDygGnGTbEDxyYvG77DNVzxwsERNq6LAHA/exec";

    // اعادة ضبط الذاكرة المحلية تلقائياً عند التحديث
    if (!localStorage.getItem('app_reset_v6')) {
        localStorage.removeItem('offline_attendance');
        localStorage.setItem('successful_sent_count', '0');
        localStorage.setItem('app_reset_v6', 'true');
    }

    const empInput = document.getElementById('empId');
    const empNameDisplay = document.getElementById('empNameDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    const connectionBanner = document.getElementById('connectionBanner');
    const sentCountDisplay = document.getElementById('sentCount');
    const pendingCountDisplay = document.getElementById('pendingCount');

    let debounceTimer;
    let autoLat = null;
    let autoLng = null;
    let verifiedEmpName = "";

    // جلب موقع الجوال تلقائياً وبصمت في الخلفية
    function autoFetchLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    autoLat = pos.coords.latitude;
                    autoLng = pos.coords.longitude;
                },
                (err) => {
                    autoLat = null;
                    autoLng = null;
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }
    }
    autoFetchLocation();

    function updateUI() {
        const pendingList = getOfflineRecords();
        const sentSuccessCount = localStorage.getItem('successful_sent_count') || "0";

        pendingCountDisplay.innerText = pendingList.length;
        sentCountDisplay.innerText = sentSuccessCount;

        if (navigator.onLine) {
            connectionBanner.className = "status-banner banner-online";
            connectionBanner.innerText = "🟢 متصل بالإنترنت";
        } else {
            connectionBanner.className = "status-banner banner-offline";
            connectionBanner.innerText = "🔴 غير متصل بالإنترنت (أوفلاين)";
        }
    }

    window.addEventListener('online', async () => {
        updateUI();
        const pendingList = getOfflineRecords();
        if (pendingList.length > 0) {
            showStatus("⚡ تم استعادة الاتصال! جاري رفع الحركات المعلقة...", "warning");
            await syncOfflineData();
        }
    });

    window.addEventListener('offline', updateUI);
    updateUI();

    // جلب الاسم تلقائياً مع ميزة دعم حفظ الأسماء للعمل بالأوفلاين
    empInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const empId = empInput.value.trim();
        verifiedEmpName = "";

        if (!empId) {
            empNameDisplay.style.display = 'none';
            return;
        }

        const cachedNames = JSON.parse(localStorage.getItem('cached_emp_names') || "{}");
        if (cachedNames[empId]) {
            verifiedEmpName = cachedNames[empId];
            empNameDisplay.style.display = 'block';
            empNameDisplay.style.color = '#0369a1';
            empNameDisplay.innerText = `👤 الموظف: ${verifiedEmpName}`;
            return;
        }

        debounceTimer = setTimeout(() => {
            fetchEmployeeNameAuto(empId);
        }, 300);
    });

    async function fetchEmployeeNameAuto(empId) {
        if (!navigator.onLine) {
            empNameDisplay.style.display = 'block';
            empNameDisplay.style.color = '#854d0e';
            empNameDisplay.innerText = 'أوفلاين (رقم جديد - سيتم تسجيله بالرقم وتطابقه لاحقاً)';
            return;
        }

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getEmpName&empId=${encodeURIComponent(empId)}`);
            const data = await response.json();
            
            if (data.success && data.name) {
                verifiedEmpName = data.name;
                empNameDisplay.style.display = 'block';
                empNameDisplay.style.color = '#0369a1';
                empNameDisplay.innerText = `👤 الموظف: ${data.name}`;

                const cachedNames = JSON.parse(localStorage.getItem('cached_emp_names') || "{}");
                cachedNames[empId] = data.name;
                localStorage.setItem('cached_emp_names', JSON.stringify(cachedNames));

            } else {
                verifiedEmpName = "";
                empNameDisplay.style.display = 'block';
                empNameDisplay.style.color = '#991b1b';
                empNameDisplay.innerText = '❌ الرقم الوظيفي غير موجود بالجدول!';
            }
        } catch (e) {
            empNameDisplay.style.display = 'block';
            empNameDisplay.style.color = '#854d0e';
            empNameDisplay.innerText = 'تعذر المطابقة المباشرة';
        }
    }

    // معالجة نموذج التسجيل
    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const empId = empInput.value.trim();
        if (!empId) {
            showStatus("❌ يرجى إدخال الرقم الوظيفي!", "error");
            return;
        }

        submitBtn.disabled = true;
        showStatus("⏳ جاري تسجيل الحضور واستخراج الموقع تلقائياً...", "warning");

        if (!autoLat || !autoLng) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        autoLat = pos.coords.latitude;
                        autoLng = pos.coords.longitude;
                        await executeSubmit(empId);
                    },
                    async (err) => {
                        await executeSubmit(empId);
                    },
                    { timeout: 6000, enableHighAccuracy: true }
                );
            } else {
                await executeSubmit(empId);
            }
        } else {
            await executeSubmit(empId);
        }
    });

    async function executeSubmit(empId) {
        const record = {
            empId: empId,
            empName: verifiedEmpName || "أوفلاين - محلي",
            actionType: "حضور",
            latitude: autoLat || "",
            longitude: autoLng || "",
            timestamp: new Date().toISOString()
        };

        if (navigator.onLine) {
            await sendToServer(record);
        } else {
            saveOfflineRecord(record);
            showStatus("📦 تم حفظ الحركة بنجاح في القائمة المعلقة (أوفلاين)!", "success");
            resetForm();
        }
    }

    async function sendToServer(record) {
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            });

            incrementSentCount(1);
            showStatus("✅ تم إرسال الحضور بنجاح!", "success");
            resetForm();
        } catch (err) {
            saveOfflineRecord(record);
            showStatus("⚠️ تعذر الاتصال بالسيرفر، تم الحفظ أوفلاين بنجاح!", "warning");
            resetForm();
        }
    }

    function saveOfflineRecord(record) {
        const list = getOfflineRecords();
        list.push(record);
        localStorage.setItem('offline_attendance', JSON.stringify(list));
        updateUI();
    }

    function getOfflineRecords() {
        return JSON.parse(localStorage.getItem('offline_attendance') || "[]");
    }

    function incrementSentCount(count) {
        let current = parseInt(localStorage.getItem('successful_sent_count') || "0");
        current += count;
        localStorage.setItem('successful_sent_count', current.toString());
        updateUI();
    }

    async function syncOfflineData() {
        const list = getOfflineRecords();
        if (list.length === 0) return;

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(list)
            });

            const sentCount = list.length;
            localStorage.removeItem('offline_attendance');
            incrementSentCount(sentCount);

            showStatus(`🎉 تم رفع جميع الحركات المعلقة (${sentCount} حركة) بنجاح! جاري تحديث الصفحة...`, "success");
            
            setTimeout(() => {
                window.location.reload();
            }, 2000);

        } catch (e) {
            showStatus("⚠️ فشلت المزامنة التلقائية. ستتم المحاولة مجدداً لاحقاً.", "error");
        }
    }

    function showStatus(msg, type) {
        statusBox.innerText = msg;
        statusBox.className = `status-msg ${type}`;
        statusBox.style.display = 'block';
    }

    function resetForm() {
        submitBtn.disabled = false;
        empInput.value = '';
        empNameDisplay.style.display = 'none';
        autoLat = null;
        autoLng = null;
        autoFetchLocation();
        updateUI();
        setTimeout(() => {
            statusBox.style.display = 'none';
        }, 4000);
    }
</script>

</body>
</html>
